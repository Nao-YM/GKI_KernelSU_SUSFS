name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          # test
          CONFIG_F2FS_FS=y
          CONFIG_F2FS_FS_XATTR=y
          CONFIG_F2FS_FS_POSIX_ACL=y
          CONFIG_F2FS_FS_COMPRESSION=y
          CONFIG_ZRAM_WRITEBACK=y
          CONFIG_ZRAM_MEMORY_TRACKING=y
          CONFIG_HZ_300=y
          CONFIG_HZ=300
          CONFIG_CPU_FREQ=y
          CONFIG_CPU_FREQ_GOV_SCHEDUTIL=n
          CONFIG_CPU_FREQ_GOV_ONDEMAND=n
          CONFIG_CPU_FREQ_GOV_REFLEX=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX=y
          CONFIG_IOSCHED_BFQ=n
          CONFIG_BFQ_GROUP_IOSCHED=n
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_ZSTD=n
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZSMALLOC=y
          